name: Deploy Flight Lab

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "vehicle_models/family/vehicle_profiles.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Flight Lab site
        run: |
          mkdir -p _site
          cp -a site/. _site/
          cp vehicle_models/family/vehicle_profiles.json _site/vehicle_profiles.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/style.css
          test -s _site/vehicle_profiles.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
