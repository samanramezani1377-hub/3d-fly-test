name: Universal PPO smoke test

on:
  pull_request:
    paths:
      - "training/fast_physics/**"
      - "training/train_universal_ppo.py"
      - "training/run_universal_curriculum.py"
      - "training/evaluate_universal_ppo.py"
      - "training/tests/test_universal_vehicle.py"
      - "training/tests/test_hover_reference.py"
      - "training/fast_physics/hover_reference.py"
      - "training/evaluate_hover_reference.py"
      - "vehicle_models/family/**"
      - "vehicle_models/smooth2_parametric/domain_randomization.json"
      - ".github/workflows/universal-ppo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-ppo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulation and PPO dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy gymnasium tensorboard
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install stable-baselines3
      - name: Run universal vehicle physics and reference-control tests
        run: python -m pytest training/tests/test_universal_vehicle.py training/tests/test_hover_reference.py -q
      - name: Run per-profile nominal oracle hover benchmark
        run: |
          python training/evaluate_hover_reference.py \
            --episodes 2 \
            --max-steps 1200 \
            --settle-seconds 3 \
            --output "${RUNNER_TEMP}/hover-reference-nominal.json"
      - name: Verify nominal reference hover on every profile
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "hover-reference-nominal.json").read_text())
          assert len(report["profiles"]) == 4
          for profile in report["profiles"]:
              assert profile["success_rate"] == 1.0, (
                  f"{profile['vehicle_id']} nominal oracle hover success "
                  f"was {profile['success_rate']}"
              )
          print("All four provisional profiles achieved sustained nominal oracle hover.")
          PY
      - name: Run all four curriculum stages as a short PPO integration smoke test
        run: |
          python training/run_universal_curriculum.py \
            --timesteps-per-stage 2048 \
            --n-envs 1 \
            --evaluation-episodes 1 \
            --run-prefix ci-universal-smoke \
            --output-dir "${RUNNER_TEMP}/universal-ppo"
      - name: Verify best-checkpoint handoff and per-stage artifacts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ["RUNNER_TEMP"]) / "universal-ppo/ci-universal-smoke-curriculum-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["checkpoint_handoff"] == "best_mean_reward"
          assert len(manifest["stages"]) == 4
          for stage in manifest["stages"]:
              assert Path(stage["final_checkpoint"]).is_file()
              assert Path(stage["selected_best_checkpoint"]).is_file()
              assert stage["checkpoint_selection"] == "best_mean_reward"
              assert Path(stage["evaluation"]).is_file()
          print("All four PPO stages trained, evaluated and handed off best checkpoints.")
          PY
