name: Universal PPO - PR validation / manual five-stage training

on:
  pull_request:
    paths:
      - "training/fast_physics/**"
      - "training/train_universal_ppo.py"
      - "training/run_universal_curriculum.py"
      - "training/evaluate_universal_ppo.py"
      - "training/tests/test_fast_physics.py"
      - "training/tests/test_universal_vehicle.py"
      - "training/tests/test_hover_reference.py"
      - "training/fast_physics/hover_reference.py"
      - "training/evaluate_hover_reference.py"
      - "vehicle_models/family/**"
      - "vehicle_models/smooth2_parametric/domain_randomization.json"
      - "docs/UNIVERSAL_VEHICLE_POLICY.md"
      - "training/README.md"
      - ".github/workflows/ppo-cpu-two-stage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-ppo-five-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  five-stage-training:
    name: ${{ github.event_name == 'pull_request' && 'PR validation only (no PPO training)' || 'Five-stage PPO training' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r training/requirements.txt
          python -c "import torch; assert torch.version.cuda is None; print('CPU-only PyTorch:', torch.__version__)"

      - name: Run existing physics, family, and hover regression tests
        if: github.event_name == 'pull_request'
        run: |
          python -m pytest -q \
            training/tests/test_fast_physics.py \
            training/tests/test_universal_vehicle.py \
            training/tests/test_hover_reference.py

      - name: Restore resumable v5 checkpoints
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p training/runs
          if [ -d training/models/universal-quad-v5 ]; then
            cp -a training/models/universal-quad-v5/. training/runs/
          fi

      - name: Run exactly five sequential PPO training stages
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          python training/run_universal_curriculum.py \
            --timesteps-per-stage 1000000 \
            --n-envs 16 \
            --run-prefix universal-quad-v5 \
            --checkpoint-eval-episodes 2 \
            --eval-frequency 100000 \
            --checkpoint-frequency 20000 \
            --evaluation-episodes 20 \
            2>&1 | tee five-stage-training.log

      - name: Commit resumable checkpoints and final-tested models to this repository
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p training/models/universal-quad-v5
          for stage_dir in training/runs/universal-quad-v5-stage*; do
            if [ -d "$stage_dir" ]; then
              mkdir -p "training/models/universal-quad-v5/$(basename "$stage_dir")"
              rsync -a --exclude 'tensorboard/' --exclude '*.csv' "$stage_dir/" "training/models/universal-quad-v5/$(basename "$stage_dir")/"
            fi
          done
          if [ -d training/runs/release ]; then
            cp -a training/runs/release training/models/universal-quad-v5/
          fi
          if [ -f training/runs/universal-quad-v5-curriculum-manifest.json ]; then
            cp training/runs/universal-quad-v5-curriculum-manifest.json training/models/universal-quad-v5/
          fi
          if [ -f training/runs/universal-quad-v5-held-out-domain-randomization.json ]; then
            cp training/runs/universal-quad-v5-held-out-domain-randomization.json training/models/universal-quad-v5/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/models/universal-quad-v5
          if ! git diff --cached --quiet; then
            find training/models/universal-quad-v5 -type f -size +90M -print -quit | grep -q . && {
              echo "A checkpoint exceeds the safe 90 MB per-file repository limit."
              exit 1
            } || true
            git commit -m "Store final-tested PPO models and resumable checkpoints"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Print training manifest and log tail
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          echo '===== FIVE-STAGE MANIFEST ====='
          if [ -f training/runs/universal-quad-v5-curriculum-manifest.json ]; then cat training/runs/universal-quad-v5-curriculum-manifest.json; else echo 'Manifest not produced'; fi
          echo '===== TRAINING LOG TAIL ====='
          if [ -f five-stage-training.log ]; then tail -c 50000 five-stage-training.log; else echo 'Training log not produced'; fi

      - name: Upload full training backup
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: universal-ppo-five-stage-backup
          path: |
            training/runs/
            training/models/universal-quad-v5/
            five-stage-training.log
          if-no-files-found: warn
          retention-days: 90
