name: PPO five-stage chained CPU training

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppo-five-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  five-stage-training:
    name: Five-stage chained PPO training (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r training/requirements.txt
          python -c "import torch; assert torch.version.cuda is None; print('CPU-only PyTorch:', torch.__version__)"

      - name: Cache native simulator core and pinned upstream source
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            training/libskysim_core.so
            .cache/skysim-upstream
          key: native-core-ubuntu-${{ hashFiles('training/build_native_core.py', 'scripts/prepare_site.py', 'config/drone.json', 'controllers/controller.py', 'sim_support/battery.hpp') }}

      - name: Build native simulator core (cache miss only)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python training/build_native_core.py

      - name: Verify CPU-only runtime and validate observations/actions
        run: |
          python -m compileall -q training
          python -m pytest -q training/tests/test_native_env.py
          python -m unittest training.test_reward_design
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("Training device: CPU (explicit)")
          assert torch.version.cuda is None, "Expected CPU-only PyTorch"
          PY
          python training/validate_observations.py | tee observation-validation.json
          python training/diagnose_control.py --steps 250 --throttles -0.5 -0.3 -0.2 -0.1 0 0.1 0.2 0.5 --output training/runs/control-diagnostics.json | tee control-diagnostics-summary.json

      - name: Run five chained universal multi-vehicle training stages
        run: |
          set -o pipefail
          python training/run_universal_curriculum.py --timesteps-per-stage 200000 --n-envs 4 --evaluation-episodes 20 2>&1 | tee five-stage-training.log

      - name: Print full result reports for direct log retrieval
        if: always()
        run: |
          echo '===== UNIVERSAL FIVE-STAGE MANIFEST ====='
          if [ -f training/runs/universal-quad-curriculum-manifest.json ]; then cat training/runs/universal-quad-curriculum-manifest.json; else echo 'Manifest not produced'; fi
          echo '===== OBSERVATION VALIDATION ====='
          if [ -f observation-validation.json ]; then cat observation-validation.json; else echo 'Validation not produced'; fi
          echo '===== CONTROL DIAGNOSTICS ====='
          if [ -f training/runs/control-diagnostics.json ]; then cat training/runs/control-diagnostics.json; else echo 'Diagnostics not produced'; fi
          echo '===== TRAINING LOG TAIL ====='
          if [ -f five-stage-training.log ]; then tail -c 30000 five-stage-training.log; else echo 'Training log not produced'; fi

      - name: Upload models, stage reports, diagnostics, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-ppo-five-stage-results
          path: |
            final-model.zip
            training/runs/five-stage-training-manifest.json
            training/runs/stage1-selected-model.zip
            training/runs/stage2-selected-model.zip
            training/runs/stage3-selected-model.zip
            training/runs/stage4-selected-model.zip
            training/runs/stage5-selected-model.zip
            training/runs/universal-quad-stage1/
            training/runs/universal-quad-stage2/
            training/runs/universal-quad-stage3/
            training/runs/universal-quad-stage4/
            training/runs/universal-quad-stage5/
            training/runs/universal-quad-stage5/
            training/runs/control-diagnostics.json
            observation-validation.json
            control-diagnostics-summary.json
            five-stage-training.log
          if-no-files-found: warn
          retention-days: 30
