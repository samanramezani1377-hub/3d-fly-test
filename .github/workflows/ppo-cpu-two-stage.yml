name: PPO five-stage chained CPU training

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppo-five-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  five-stage-training:
    name: Five-stage chained PPO training (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/requirements.txt

      - name: Cache native simulator core and pinned upstream source
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            training/libskysim_core.so
            .cache/skysim-upstream
          key: native-core-ubuntu-${{ hashFiles('training/build_native_core.py', 'scripts/prepare_site.py', 'config/drone.json', 'controllers/controller.py', 'sim_support/battery.hpp') }}

      - name: Build native simulator core (cache miss only)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python training/build_native_core.py

      - name: Verify CPU-only runtime and validate observations/actions
        run: |
          python -m compileall -q training
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("Training device: CPU (explicit)")
          PY
          python training/validate_observations.py | tee observation-validation.json
          python training/diagnose_control.py --steps 100 --throttles -1 -0.5 0 0.5 1 --output training/runs/control-diagnostics.json | tee control-diagnostics-summary.json

      - name: Run five chained training stages
        run: |
          set -o pipefail
          python training/run_five_stage.py 2>&1 | tee five-stage-training.log

      - name: Upload models, stage reports, diagnostics, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppo-five-stage-results
          path: |
            final-model.zip
            training/runs/five-stage-training-manifest.json
            training/runs/stage1-selected-model.zip
            training/runs/stage2-selected-model.zip
            training/runs/stage3-selected-model.zip
            training/runs/stage4-selected-model.zip
            training/runs/stage5-selected-model.zip
            training/runs/ppo-stage1-seed42/
            training/runs/ppo-stage1-seed43/
            training/runs/ppo-stage2-continued/
            training/runs/ppo-stage3-continued/
            training/runs/ppo-stage4-continued/
            training/runs/ppo-stage5-continued/
            training/runs/control-diagnostics.json
            observation-validation.json
            control-diagnostics-summary.json
            five-stage-training.log
          if-no-files-found: warn
          retention-days: 30
