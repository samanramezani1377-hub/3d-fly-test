name: Universal five-stage PPO training

on:
  pull_request:
    paths:
      - "training/fast_physics/**"
      - "training/train_universal_ppo.py"
      - "training/run_universal_curriculum.py"
      - "training/evaluate_universal_ppo.py"
      - "training/tests/test_fast_physics.py"
      - "training/tests/test_universal_vehicle.py"
      - "training/tests/test_hover_reference.py"
      - "training/fast_physics/hover_reference.py"
      - "training/evaluate_hover_reference.py"
      - "vehicle_models/family/**"
      - "vehicle_models/smooth2_parametric/domain_randomization.json"
      - "docs/UNIVERSAL_VEHICLE_POLICY.md"
      - "training/README.md"
      - ".github/workflows/ppo-cpu-two-stage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-ppo-five-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  five-stage-training:
    name: Universal PPO validation or full five-stage training
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r training/requirements.txt
          python -c "import torch; assert torch.version.cuda is None; print('CPU-only PyTorch:', torch.__version__)"

      - name: Run existing physics, family, and hover regression tests
        if: github.event_name == 'pull_request'
        run: |
          python -m pytest -q \
            training/tests/test_fast_physics.py \
            training/tests/test_universal_vehicle.py \
            training/tests/test_hover_reference.py

      - name: Run the complete five-stage, one-million-transition PPO curriculum
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          python training/run_universal_curriculum.py \
            --timesteps-per-stage 200000 \
            --n-envs 4 \
            --evaluation-episodes 20 \
            2>&1 | tee five-stage-training.log

      - name: Print training manifest and log tail
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          echo '===== FIVE-STAGE MANIFEST ====='
          if [ -f training/runs/universal-quad-curriculum-manifest.json ]; then cat training/runs/universal-quad-curriculum-manifest.json; else echo 'Manifest not produced'; fi
          echo '===== TRAINING LOG TAIL ====='
          if [ -f five-stage-training.log ]; then tail -c 50000 five-stage-training.log; else echo 'Training log not produced'; fi

      - name: Upload checkpoints, per-profile evaluations, manifest, and logs
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: universal-ppo-five-stage-results
          path: |
            training/runs/universal-quad-curriculum-manifest.json
            training/runs/held-out-domain-randomization.json
            training/runs/universal-quad-stage1/
            training/runs/universal-quad-stage2/
            training/runs/universal-quad-stage3/
            training/runs/universal-quad-stage4/
            training/runs/universal-quad-stage5/
            five-stage-training.log
          if-no-files-found: warn
          retention-days: 30
