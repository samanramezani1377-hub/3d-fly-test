name: PPO two-stage CPU training

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppo-cpu-two-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  stage1:
    name: Stage 1 PPO seed ${{ matrix.seed }} (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/requirements.txt

      - name: Cache native simulator core and pinned upstream source
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            training/libskysim_core.so
            .cache/skysim-upstream
          key: native-core-ubuntu-${{ hashFiles('training/build_native_core.py', 'scripts/prepare_site.py', 'config/drone.json', 'controllers/controller.py', 'sim_support/battery.hpp') }}

      - name: Build native simulator core (cache miss only)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python training/build_native_core.py

      - name: Verify CPU-only runtime
        run: |
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("Training device: CPU (explicit)")
          PY

      - name: Validate observation slots and action mapping
        run: |
          python training/validate_observations.py | tee observation-validation.json
          python training/diagnose_control.py --steps 100 --throttles -1 -0.5 0 0.5 1 --output training/runs/control-diagnostics.json | tee control-diagnostics-summary.json

      - name: Train Stage 1 candidate
        env:
          SEED: ${{ matrix.seed }}
          TIMESTEPS: "100000"
          EVAL_EPISODES: "10"
        run: |
          set -o pipefail
          python training/train_ppo.py \
            --timesteps "$TIMESTEPS" \
            --seed "$SEED" \
            --run-name "ppo-hover-100k-seed$SEED" \
            --output-dir training/runs \
            --device cpu \
            --n-envs 1 \
            --n-steps 1024 \
            --batch-size 64 \
            --save-freq 10000 \
            --eval-freq 10000 \
            --eval-episodes "$EVAL_EPISODES" 2>&1 | tee "ppo-seed$SEED.log"

      - name: Upload Stage 1 candidate and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppo-stage1-seed${{ matrix.seed }}
          path: |
            training/runs/ppo-hover-100k-seed${{ matrix.seed }}/
            training/runs/control-diagnostics.json
            observation-validation.json
            control-diagnostics-summary.json
            ppo-seed${{ matrix.seed }}.log
          if-no-files-found: error
          retention-days: 14

  stage2:
    name: Stage 2 continue best Stage 1 model (CPU)
    runs-on: ubuntu-latest
    needs: stage1
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r training/requirements.txt

      - name: Cache native simulator core and pinned upstream source
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            training/libskysim_core.so
            .cache/skysim-upstream
          key: native-core-ubuntu-${{ hashFiles('training/build_native_core.py', 'scripts/prepare_site.py', 'config/drone.json', 'controllers/controller.py', 'sim_support/battery.hpp') }}

      - name: Build native simulator core (cache miss only)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python training/build_native_core.py

      - name: Download seed 42 candidate
        uses: actions/download-artifact@v4
        with:
          name: ppo-stage1-seed42
          path: stage1/seed42

      - name: Download seed 43 candidate
        uses: actions/download-artifact@v4
        with:
          name: ppo-stage1-seed43
          path: stage1/seed43

      - name: Select Stage 1 checkpoint by flight stability
        id: select
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          def rank(report):
              # Higher is better for success/stability; lower is better for crashes/errors.
              return (
                  float(report["hover_success_rate"]),
                  -float(report["crash_rate"]),
                  float(report["mean_hover_stable_fraction"]),
                  -float(report["mean_absolute_vertical_speed_during_flight_mps"]),
                  -float(report["mean_absolute_final_altitude_error_m"]),
                  float(report["mean_return"]),
              )

          candidates = []
          for seed in (42, 43):
              root = Path(f"stage1/seed{seed}")
              models = list(root.rglob("best_model.zip"))
              if not models:
                  raise SystemExit(f"Missing best checkpoint for seed {seed}")
              model = models[0].resolve()
              report_path = Path(f"stage1-seed{seed}-evaluation.json")
              subprocess.run([
                  sys.executable, "training/evaluate.py", "--model", str(model),
                  "--episodes", "20", "--seed", "2000", "--output", str(report_path),
              ], check=True)
              report = json.loads(report_path.read_text())
              candidates.append({
                  "seed": seed,
                  "model": str(model),
                  "evaluation": str(report_path),
                  "hover_success_rate": float(report["hover_success_rate"]),
                  "crash_rate": float(report["crash_rate"]),
                  "mean_hover_stable_fraction": float(report["mean_hover_stable_fraction"]),
                  "mean_absolute_vertical_speed_during_flight_mps": float(report["mean_absolute_vertical_speed_during_flight_mps"]),
                  "mean_absolute_final_altitude_error_m": float(report["mean_absolute_final_altitude_error_m"]),
                  "mean_return": float(report["mean_return"]),
              })

          selected = max(candidates, key=rank)
          Path("stage1-selection.json").write_text(json.dumps({
              "selection_metric": [
                  "hover_success_rate descending",
                  "crash_rate ascending",
                  "mean_hover_stable_fraction descending",
                  "mean_absolute_vertical_speed_during_flight_mps ascending",
                  "mean_absolute_final_altitude_error_m ascending",
                  "mean_return descending (tie-breaker only)",
              ],
              "candidates": candidates,
              "selected": selected,
          }, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"model={selected['model']}\n")
              f.write(f"seed={selected['seed']}\n")
          print(json.dumps(selected, indent=2))
          PY

      - name: Train Stage 2 on selected model (CPU)
        env:
          INITIAL_MODEL: ${{ steps.select.outputs.model }}
          STAGE2_TIMESTEPS: "100000"
          EVAL_EPISODES: "10"
        run: |
          set -o pipefail
          python training/train_ppo.py \
            --timesteps "$STAGE2_TIMESTEPS" \
            --seed 44 \
            --run-name ppo-stage2-continued \
            --output-dir training/runs \
            --load-model "$INITIAL_MODEL" \
            --device cpu \
            --n-envs 1 \
            --n-steps 1024 \
            --batch-size 64 \
            --save-freq 10000 \
            --eval-freq 10000 \
            --eval-episodes "$EVAL_EPISODES" 2>&1 | tee ppo-stage2.log

      - name: Evaluate selected Stage 1 checkpoint
        run: |
          python training/evaluate.py \
            --model "${{ steps.select.outputs.model }}" \
            --episodes 20 --seed 2000 \
            --output stage1-selected-evaluation.json

      - name: Evaluate Stage 2 best checkpoint (if available)
        shell: bash
        run: |
          set -euo pipefail
          MODEL="training/runs/ppo-stage2-continued/best/best_model.zip"
          if [[ -f "$MODEL" ]]; then
            python training/evaluate.py --model "$MODEL" --episodes 20 --seed 2000 \
              --output stage2-best-evaluation.json
          else
            echo "Stage 2 produced no best checkpoint; preserving Stage 1 model." | tee stage2-evaluation-notes.txt
          fi

      - name: Keep the best model after matched-seed evaluation
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          stage1_report = json.loads(Path("stage1-selected-evaluation.json").read_text())
          candidates = [{
              "stage": "stage1",
              "model": "${{ steps.select.outputs.model }}",
              "hover_success_rate": float(stage1_report["hover_success_rate"]),
              "crash_rate": float(stage1_report["crash_rate"]),
              "mean_hover_stable_fraction": float(stage1_report["mean_hover_stable_fraction"]),
              "mean_absolute_vertical_speed_during_flight_mps": float(stage1_report["mean_absolute_vertical_speed_during_flight_mps"]),
              "mean_absolute_final_altitude_error_m": float(stage1_report["mean_absolute_final_altitude_error_m"]),
              "mean_return": float(stage1_report["mean_return"]),
          }]

          stage2_model = Path("training/runs/ppo-stage2-continued/best/best_model.zip")
          stage2_report = Path("stage2-best-evaluation.json")
          if stage2_model.is_file() and stage2_report.is_file():
              report = json.loads(stage2_report.read_text())
              candidates.append({
                  "stage": "stage2",
                  "model": str(stage2_model),
                  "hover_success_rate": float(report["hover_success_rate"]),
                  "crash_rate": float(report["crash_rate"]),
                  "mean_hover_stable_fraction": float(report["mean_hover_stable_fraction"]),
                  "mean_absolute_vertical_speed_during_flight_mps": float(report["mean_absolute_vertical_speed_during_flight_mps"]),
                  "mean_absolute_final_altitude_error_m": float(report["mean_absolute_final_altitude_error_m"]),
                  "mean_return": float(report["mean_return"]),
              })

          def rank(item):
              return (
                  item["hover_success_rate"],
                  -item["crash_rate"],
                  item["mean_hover_stable_fraction"],
                  -item["mean_absolute_vertical_speed_during_flight_mps"],
                  -item["mean_absolute_final_altitude_error_m"],
                  item["mean_return"],
              )

          winner = max(candidates, key=rank)
          output = Path("final-model.zip")
          shutil.copy2(winner["model"], output)
          deployment_eligible = (
              winner["crash_rate"] == 0.0
              and winner["hover_success_rate"] == 1.0
          )
          manifest = {
              "selection_metric": [
                  "hover_success_rate descending",
                  "crash_rate ascending",
                  "mean_hover_stable_fraction descending",
                  "mean_absolute_vertical_speed_during_flight_mps ascending",
                  "mean_absolute_final_altitude_error_m ascending",
                  "mean_return descending (tie-breaker only)",
              ],
              "candidates": candidates,
              "selected": winner,
              "deployment_eligible": deployment_eligible,
              "simulation_only": True,
              "warning": (
                  "Not validated for real flight; verify physics parity and physical aircraft model first."
                  if deployment_eligible else
                  "No candidate met the zero-crash and 100% hover-success gate. This is only the least-unsafe simulation candidate; do not deploy."
              ),
          }
          Path("final-model-selection.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload final models, evaluation reports, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppo-cpu-two-stage-results
          path: |
            stage1-selection.json
            stage1-seed42-evaluation.json
            stage1-seed43-evaluation.json
            training/runs/control-diagnostics.json
            observation-validation.json
            control-diagnostics-summary.json
            final-model.zip
            final-model-selection.json
            stage1/
            training/runs/ppo-stage2-continued/
            stage1-selected-evaluation.json
            stage2-best-evaluation.json
            stage2-evaluation-notes.txt
            ppo-stage2.log
          if-no-files-found: warn
          retention-days: 30
