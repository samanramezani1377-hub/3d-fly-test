name: Preflight asset integrity

on:
  push:
    branches: [main]
    paths:
      - "assets/preflight/**"
      - "scripts/validate_preflight_assets.py"
      - "tests/test_preflight_asset_validator.py"
      - ".github/workflows/preflight-assets.yml"
  pull_request:
    paths:
      - "assets/preflight/**"
      - "scripts/validate_preflight_assets.py"
      - "tests/test_preflight_asset_validator.py"
      - ".github/workflows/preflight-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-imported-cad-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate imported STEP and metadata assets
        run: python scripts/validate_preflight_assets.py
      - name: Run validator unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_preflight_asset_validator.py
