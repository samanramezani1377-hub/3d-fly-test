name: PPO parallel environments speed and quality experiment

on:
  workflow_dispatch:
    inputs:
      timesteps:
        description: "Training transitions per seed and environment count"
        required: true
        default: "50000"
        type: string
      eval_episodes:
        description: "Evaluation episodes per trained model"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: ppo-parallel-quality-experiment-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  compare-parallel-envs:
    name: Compare PPO env count speed and quality
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Install CPU-only Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r training/requirements.txt
          python -c "import torch; assert torch.version.cuda is None; print('CPU-only PyTorch:', torch.__version__)"

      - name: Cache native simulator core and pinned upstream source
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            training/libskysim_core.so
            .cache/skysim-upstream
          key: native-core-ubuntu-${{ hashFiles('training/build_native_core.py', 'scripts/prepare_site.py', 'config/drone.json', 'controllers/controller.py', 'sim_support/battery.hpp') }}

      - name: Build native simulator core (cache miss only)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python training/build_native_core.py

      - name: Validate Python and simulator setup
        run: |
          python -m compileall -q training
          python -m unittest training.test_reward_design
          python training/validate_observations.py

      - name: Train and evaluate 1, 4, and 8 environments
        run: |
          set -o pipefail
          python training/benchmark_parallel_envs_quality.py \
            --timesteps "${{ inputs.timesteps }}" \
            --eval-episodes "${{ inputs.eval_episodes }}" \
            2>&1 | tee parallel-env-quality-experiment.log

      - name: Print comparison report
        if: always()
        run: |
          if [ -f training/runs/parallel-env-quality-experiment.json ]; then
            cat training/runs/parallel-env-quality-experiment.json
          else
            echo "Experiment report was not produced."
          fi
          if [ -f parallel-env-quality-experiment.log ]; then
            tail -c 30000 parallel-env-quality-experiment.log
          fi

      - name: Upload experiment models, metrics, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppo-parallel-env-speed-quality-results
          path: |
            training/runs/parallel-env-quality/
            training/runs/parallel-env-quality-experiment.json
            parallel-env-quality-experiment.log
          if-no-files-found: warn
          retention-days: 30
