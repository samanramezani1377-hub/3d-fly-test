name: PPO reward regression tests

on:
  pull_request:
    paths:
      - "training/native_env.py"
      - "training/run_five_stage.py"
      - "training/select_checkpoint.py"
      - "training/test_reward_design.py"
      - ".github/workflows/ppo-reward-regression.yml"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "training/native_env.py"
      - "training/run_five_stage.py"
      - "training/select_checkpoint.py"
      - "training/test_reward_design.py"
      - ".github/workflows/ppo-reward-regression.yml"

permissions:
  contents: read

jobs:
  reward-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade numpy gymnasium
      - name: Compile training modules
        run: python -m compileall -q training
      - name: Test reward shaping and checkpoint ranking
        run: python -m unittest training.test_reward_design
