name: One-time sync quadcopter model from 3D kilo
# Triggered only on the dedicated migration branch.

on:
  push:
    branches:
      - a2212-kv1000-spec

permissions:
  contents: write

concurrency:
  group: sync-kilo-model-assets
  cancel-in-progress: false

jobs:
  sync-model:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          ref: a2212-kv1000-spec
          fetch-depth: 0

      - name: Checkout authoritative source branch
        uses: actions/checkout@v4
        with:
          repository: samanramezani1377-hub/3D
          ref: d591b81bd671e04abe7d4bdeb0865fd3c3bf381b
          path: source-3d
          fetch-depth: 1

      - name: Replace complete CAD source and generated model package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cad/parametric
          mkdir -p cad/parametric
          cp -a source-3d/cad/parametric/. cad/parametric/

          rm -rf assets/preflight/smooth2-parametric
          mkdir -p assets/preflight/smooth2-parametric
          cp -a source-3d/output/smooth2-parametric/. assets/preflight/smooth2-parametric/

          cat > assets/preflight/MODEL_SOURCE_REVISION.md <<'EOF'
          # Authoritative quadcopter model source

          - Repository: https://github.com/samanramezani1377-hub/3D
          - Branch: `kilo`
          - Source commit: `d591b81bd671e04abe7d4bdeb0865fd3c3bf381b`
          - Parametric CAD source: `cad/parametric/`
          - Generated assembly and per-part exports: `output/smooth2-parametric/`

          The destination CAD source and generated exports are copied together from this single immutable source revision.
          Do not combine files from other branches or older exports. The geometry package's own README, assembly manifest,
          parameter snapshot, and validation report are retained from the same source revision.

          This synchronization does not constitute physical mass-property calibration, propeller thrust testing,
          motor/ESC characterization, print-fit validation, or flight-safety approval. Re-derive simulator geometry
          metadata and mass properties from this exact revision before treating prior geometry-derived values as current.
          EOF

      - name: Verify source/output package consistency
        shell: bash
        run: |
          set -euo pipefail
          test -f cad/parametric/drone_parametric.py
          test -f cad/parametric/model.params.json
          test -f cad/parametric/body_sections.json
          test -f assets/preflight/smooth2-parametric/drone_parametric.step
          test -f assets/preflight/smooth2-parametric/drone_parametric.stl
          test -f assets/preflight/smooth2-parametric/assembly-manifest.json
          test -f assets/preflight/smooth2-parametric/validation-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("assets/preflight/smooth2-parametric/assembly-manifest.json").read_text())
          report = json.loads(Path("assets/preflight/smooth2-parametric/validation-report.json").read_text())
          assert manifest.get("branch_scope") == "kilo", manifest.get("branch_scope")
          assert report.get("branch") == "kilo", report.get("branch")
          assert report.get("assembly", {}).get("shape_valid") is True
          assert report.get("assembly", {}).get("solid_count") == 26
          print("Verified kilo source manifest and 26-solid validation report.")
          PY

      - name: Commit synchronized model package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cad/parametric assets/preflight/smooth2-parametric assets/preflight/MODEL_SOURCE_REVISION.md
          if git diff --cached --quiet; then
            echo "No model changes to commit."
            exit 0
          fi
          git commit -m "Replace quadcopter model package from 3D kilo [skip ci]"
          git push origin HEAD:a2212-kv1000-spec
