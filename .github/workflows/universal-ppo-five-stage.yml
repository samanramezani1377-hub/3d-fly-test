name: Universal PPO - Five-stage curriculum

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-ppo-five-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  train-five-stage-ppo:
    name: Five-stage PPO training (stage 1 currently active)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r training/requirements.txt
          python -c "import torch; assert torch.version.cuda is None; print('CPU-only PyTorch:', torch.__version__)"

      - name: Restore resumable stage-1 foundation checkpoints
        run: |
          mkdir -p training/runs
          if [ -d training/models/universal-quad-v5-foundation ]; then
            cp -a training/models/universal-quad-v5-foundation/. training/runs/
          fi

      - name: Train active curriculum stages
        run: |
          set -o pipefail
          python training/run_universal_curriculum.py \
            --active-stages 1 --timesteps-per-stage 2000000 \
            --n-envs 32 \
            --run-prefix universal-quad-v5-foundation \
            --checkpoint-eval-episodes 2 \
            --eval-frequency 100000 \
            --checkpoint-frequency 20000 \
            --evaluation-episodes 20 \
            2>&1 | tee single-stage-training.log

      - name: Commit resumable checkpoints and evaluated models
        if: always()
        run: |
          set -euo pipefail
          mkdir -p training/models/universal-quad-v5-foundation
          for stage_dir in training/runs/universal-quad-v5-foundation-stage*; do
            if [ -d "$stage_dir" ]; then
              mkdir -p "training/models/universal-quad-v5-foundation/$(basename "$stage_dir")"
              rsync -a --exclude 'tensorboard/' --exclude '*.csv' "$stage_dir/" "training/models/universal-quad-v5-foundation/$(basename "$stage_dir")/"
            fi
          done
          if [ -d training/runs/release ]; then
            cp -a training/runs/release training/models/universal-quad-v5-foundation/
          fi
          if [ -f training/runs/universal-quad-v5-foundation-curriculum-manifest.json ]; then
            cp training/runs/universal-quad-v5-foundation-curriculum-manifest.json training/models/universal-quad-v5-foundation/
          fi
          if [ -f training/runs/universal-quad-v5-foundation-held-out-domain-randomization.json ]; then
            cp training/runs/universal-quad-v5-foundation-held-out-domain-randomization.json training/models/universal-quad-v5-foundation/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/models/universal-quad-v5-foundation
          if ! git diff --cached --quiet; then
            find training/models/universal-quad-v5-foundation -type f -size +90M -print -quit | grep -q . && {
              echo "A checkpoint exceeds the safe 90 MB per-file repository limit."
              exit 1
            } || true
            git commit -m "Store final-tested PPO models and resumable checkpoints"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Print training manifest and log tail
        if: always()
        run: |
          echo '===== FIVE-STAGE CURRICULUM MANIFEST ====='
          if [ -f training/runs/universal-quad-v5-foundation-curriculum-manifest.json ]; then cat training/runs/universal-quad-v5-foundation-curriculum-manifest.json; else echo 'Manifest not produced'; fi
          echo '===== TRAINING LOG TAIL ====='
          if [ -f single-stage-training.log ]; then tail -c 50000 single-stage-training.log; else echo 'Training log not produced'; fi

      - name: Upload training backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-ppo-five-stage-backup
          path: |
            training/runs/
            training/models/universal-quad-v5-foundation/
            single-stage-training.log
          if-no-files-found: warn
          retention-days: 90
