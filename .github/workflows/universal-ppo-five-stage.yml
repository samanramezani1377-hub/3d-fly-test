name: Smooth2-only PPO - Five-stage 3D velocity and yaw-rate curriculum

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: universal-quad-ppo-five-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
  STAGE_STEPS: "400000"
  N_ENVS: "100"

jobs:
  train-universal-family:
    name: Smooth2 only - 5 x (400K teacher + 400K teacher-free), 100 parallel envs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r training/requirements.txt
          python -c "import torch; assert torch.version.cuda is None; print('CPU-only PyTorch:', torch.__version__)"

      - name: Run teacher-only randomized capability preflight (must pass before PPO)
        run: |
          set -euo pipefail
          python -m py_compile \
            training/fast_physics/velocity_reference.py \
            training/fast_physics/ppo_action.py \
            training/train_universal_ppo.py \
            training/preflight_velocity_teacher.py
          python training/preflight_velocity_teacher.py \
            --vehicle-family vehicle_models/family/vehicle_profiles.json \
            --vehicle-id smooth2-a2212-custom-prop \
            --randomization-config vehicle_models/family/domain_randomization.json \
            --output training/runs/universal-teacher-preflight/report.json

      - name: Preserve teacher preflight report even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-teacher-capability-preflight
          path: training/runs/universal-teacher-preflight/report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Restore selected 1M teacher-assisted checkpoint
        uses: actions/download-artifact@v4
        with:
          name: universal-ppo-stage2-teacher-to-teacher-free-backup
          run-id: 41158518207
          github-token: ${{ github.token }}
          path: bootstrap

      - name: Verify selected teacher-assisted 1M bootstrap checkpoint and Smooth2 physics profile
        run: |
          set -euo pipefail
          source_dir="bootstrap/training/runs/universal-quad-v5-foundation-stage2-teacher"
          source_model="$source_dir/best/best_model.zip"
          source_selection="$source_dir/best/selection.json"
          test -s "$source_model"
          test -s "$source_selection"
          python - "$source_selection" <<'PY'
          import json, sys
          from pathlib import Path
          selected = json.loads(Path(sys.argv[1]).read_text())
          assert selected.get("timesteps") == 1000000, f"Expected the selected 1M teacher checkpoint: {selected}"
          print("Verified 1M teacher-assisted checkpoint:", selected)
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("vehicle_models/family/vehicle_profiles.json").read_text())
          expected = {"smooth2-a2212-custom-prop"}
          actual = {x["vehicle_id"] for x in p["profiles"]}
          assert expected.issubset(actual), f"Smooth2 profile missing: {sorted(actual)}"
          smooth2_profiles = [x for x in p["profiles"] if x["vehicle_id"] in expected]
          assert len(smooth2_profiles) == 1, smooth2_profiles
          status_by_id = {x["vehicle_id"]: x["calibration_status"] for x in smooth2_profiles}
          assert status_by_id["smooth2-a2212-custom-prop"] == "cad_bemt_estimate", status_by_id
          smooth2 = next(x for x in p["profiles"] if x["vehicle_id"] == "smooth2-a2212-custom-prop")
          assert abs(smooth2["propulsion"]["thrust_coefficient_n_per_rad_s2"] - 5.53666e-6) < 1e-10
          assert abs(smooth2["propulsion"]["max_rotor_speed_rad_s"] - 1051.8) < 0.2
          print("Smooth2 CAD/BEMT estimate selected for this Smooth2-only curriculum:", status_by_id)
          PY
          mkdir -p training/runs
          cp "$source_model" training/runs/universal-initial-from-1m-teacher-best.zip
          cp "$source_selection" training/runs/universal-initial-from-1m-teacher-best-selection.json
          sha256sum "$source_model" | tee training/runs/universal-initial-from-1m-teacher-best.sha256

      - name: Train five chained teacher-assisted then teacher-free velocity and yaw-rate stages
        run: |
          set -euo pipefail
          checkpoint="training/runs/universal-initial-from-1m-teacher-best.zip"
          for stage in 1 2 3 4 5; do
            teacher_run="universal-velocity-ppo-stage-${stage}-teacher"
            student_run="universal-velocity-ppo-stage-${stage}-teacher-free"

            echo "===== Stage ${stage}A: 400K steps, velocity/yaw teacher weight 0.80, 100 envs ====="
            python training/train_universal_ppo.py \
              --timesteps "$STAGE_STEPS" --n-envs "$N_ENVS" \
              --seed "$((2042 + stage * 10 + 1))" \
              --run-name "$teacher_run" --output-dir training/runs \
              --vehicle-family vehicle_models/family/vehicle_profiles.json \
              --vehicle-id smooth2-a2212-custom-prop \
              --randomization-config vehicle_models/family/domain_randomization.json \
              --curriculum-stage "$stage" \
              --load-model "$checkpoint" \
              --teacher-weight "0.8" --velocity-control \
              --eval-episodes 10 --eval-frequency 200000 \
              --checkpoint-frequency 50000 \
              2>&1 | tee "$teacher_run.log"

            teacher_best="training/runs/$teacher_run/best/best_model.zip"
            test -s "$teacher_best" || { echo "Stage $stage teacher phase produced no evaluated best checkpoint"; exit 1; }
            test -s "training/runs/$teacher_run/best/selection.json"

            echo "===== Stage ${stage}B: 400K steps, teacher disabled (0.00), 100 envs ====="
            python training/train_universal_ppo.py \
              --timesteps "$STAGE_STEPS" --n-envs "$N_ENVS" \
              --seed "$((2042 + stage * 10 + 2))" \
              --run-name "$student_run" --output-dir training/runs \
              --vehicle-family vehicle_models/family/vehicle_profiles.json \
              --vehicle-id smooth2-a2212-custom-prop \
              --randomization-config vehicle_models/family/domain_randomization.json \
              --curriculum-stage "$stage" \
              --load-model "$teacher_best" \
              --no-teacher --teacher-weight "0.0" --velocity-control \
              --eval-episodes 10 --eval-frequency 200000 \
              --checkpoint-frequency 50000 \
              2>&1 | tee "$student_run.log"

            checkpoint="training/runs/$student_run/best/best_model.zip"
            test -s "$checkpoint" || { echo "Stage $stage teacher-free phase produced no evaluated best checkpoint"; exit 1; }
            test -s "training/runs/$student_run/best/selection.json"
          done
          cp "$checkpoint" training/runs/universal-final-selected-best.zip

      - name: Run independent final velocity and yaw-rate evaluation
        run: |
          set -euo pipefail
          evaluation_dir="training/runs/universal-final-independent-evaluation"
          mkdir -p "$evaluation_dir"
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          from stable_baselines3 import PPO

          sys.path.insert(0, str(Path("training").resolve()))
          from train_universal_ppo import BalancedProfileCallback
          from fast_physics.vehicle_family import load_vehicle_profiles

          model_path = Path("training/runs/universal-final-selected-best.zip")
          family_path = Path("vehicle_models/family/vehicle_profiles.json")
          randomization_path = Path("vehicle_models/family/domain_randomization.json")
          output_dir = Path("training/runs/universal-final-independent-evaluation")
          assert model_path.is_file() and model_path.stat().st_size > 0, "Final selected PPO model is missing"
          profiles = load_vehicle_profiles(family_path)
          expected_profile_ids = {"smooth2-a2212-custom-prop"}
          profiles = [p for p in profiles if p["vehicle_id"] in expected_profile_ids]
          assert {p["vehicle_id"] for p in profiles} == expected_profile_ids, profiles
          assert len(profiles) == 1, profiles

          model = PPO.load(str(model_path), device="cpu")
          callback = BalancedProfileCallback(
              profiles=profiles,
              family_path=family_path,
              randomization_path=randomization_path,
              history_length=4,
              stage=5,
              episodes=10,
              frequency=1,
              checkpoint_frequency=2**62,
              best_dir=output_dir / "selection",
              reports_dir=output_dir / "reports",
              seed=987654,
              disable_teacher=True,
              teacher_weight=0.0,
              velocity_control=True,
          )
          callback.init_callback(model)
          callback.last_checkpoint_timesteps = int(model.num_timesteps)
          callback.last_eval_timesteps = 0
          callback._on_rollout_end()

          reports = sorted((output_dir / "reports").glob("profile-evaluation-*.json"))
          assert len(reports) == 1, f"Expected exactly one final evaluation report, found {reports}"
          report = json.loads(reports[0].read_text(encoding="utf-8"))
          expected_ids = {"smooth2-a2212-custom-prop"}
          results = report.get("profiles", [])
          actual_ids = {item.get("vehicle_id") for item in results}
          assert actual_ids == expected_ids, f"Independent evaluation did not cover Smooth2 only: {actual_ids}"
          assert len(results) == 1, report
          metric_keys = (
              "success_rate", "takeoff_success_rate", "takeoff_failure_rate",
              "crash_rate", "mean_velocity_tracking_error_m_s",
              "mean_max_direction_tracking_error_m_s",
              "mean_velocity_direction_coverage",
              "mean_yaw_rate_tracking_error_rad_s",
              "mean_max_yaw_command_tracking_error_rad_s",
              "mean_yaw_command_coverage",
              "mean_neutral_braking_time_seconds",
              "mean_motor_saturation_fraction",
              "mean_estimated_battery_current_a",
              "mean_estimated_battery_energy_consumed_wh",
              "mean_estimated_battery_consumed_ah",
              "mean_final_battery_state_of_charge_estimate",
          )
          metrics_by_vehicle = {}
          for result in results:
              assert len(result.get("episodes", [])) == 10, result
              metrics_by_vehicle[result["vehicle_id"]] = {key: result.get(key) for key in metric_keys}
          metadata = {
              "evaluation_type": "independent_final_evaluation",
              "independence": "fresh deterministic seed range, separate from all periodic checkpoint-selection evaluations",
              "seed_start": 987654,
              "episodes_per_vehicle": 10,
              "vehicle_count": 1,
              "vehicle_ids": sorted(actual_ids),
              "curriculum_stage": 5,
              "teacher_disabled": True,
              "velocity_control": True,
              "model": str(model_path),
              "model_timesteps": int(model.num_timesteps),
              "report": str(reports[0]),
              "metrics_by_vehicle": metrics_by_vehicle,
          }
          (output_dir / "final-evaluation-summary.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )
          print(json.dumps(metadata, indent=2))
          PY

      - name: Publish Smooth2-only curriculum outputs
        if: success()
        run: |
          set -euo pipefail
          target="training/models/smooth2-only-five-stage"
          mkdir -p "$target"
          cp -a training/runs/universal-velocity-ppo-stage-* "$target/"
          cp training/runs/universal-initial-from-1m-teacher-best.zip "$target/"
          cp training/runs/universal-initial-from-1m-teacher-best-selection.json "$target/"
          cp training/runs/universal-initial-from-1m-teacher-best.sha256 "$target/"
          cp training/runs/universal-final-selected-best.zip "$target/"
          cp -a training/runs/universal-final-independent-evaluation "$target/"
          cp vehicle_models/family/domain_randomization.json "$target/domain_randomization.json"
          cp training/runs/universal-teacher-preflight/report.json "$target/teacher-preflight-report.json"
          cat > "$target/training-plan.json" <<'JSON'
          {
            "vehicle_family": ["smooth2-a2212-custom-prop"],
            "profile_sampling": "pinned Smooth2-only sampling; no other vehicle profile is eligible",
            "domain_randomization": "Smooth2-only proportional randomization around CAD/BEMT and mass-property engineering estimates; bounds are simulation priors",
            "initial_checkpoint": "best teacher-assisted checkpoint selected at 1000000 steps from run 41158518207; legacy physics checkpoint used only as a policy warm start and retrained/evaluated in current Smooth2 BEMT physics",
            "stages": 5,
            "timesteps_per_phase": 400000,
            "phases_per_stage": 2,
            "teacher_phase_weight": 0.80,
            "teacher_free_phase_weight": 0.0,
            "timesteps_per_stage": 800000,
            "total_additional_timesteps": 4000000,
            "training_mode": "nose-relative 3D velocity tracking plus independent yaw-rate control with hover warm-start",
            "velocity_command_frame": "yaw-aligned nose-forward/nose-left plus world-up; positive yaw rate turns nose left (counter-clockwise viewed from above)",
            "yaw_rate_command_limits_deg_s_by_stage": {"stage_1": 20, "stage_2": 35, "stage_3": 50, "stage_4": 70, "stage_5": 90},
            "yaw_rate_command_units": "radians_per_second internally; degrees_per_second in this plan for readability",
            "velocity_command_limits_m_s": [1.5, 1.5, 0.75],
            "velocity_command_curriculum": {
              "stage_1": "single-axis low speed including yaw-only turns",
              "stage_2": "single-axis medium speed including yaw",
              "stage_3": "two-axis translation/yaw combinations",
              "stage_4": "two/three-axis translation/yaw combinations",
              "stage_5": "continuous random 3D velocity and yaw-rate commands"
            },
            "teacher_training_weights_by_stage": {"stage_1": {"teacher_phase": 0.80, "teacher_free_phase": 0.0}, "stage_2": {"teacher_phase": 0.80, "teacher_free_phase": 0.0}, "stage_3": {"teacher_phase": 0.80, "teacher_free_phase": 0.0}, "stage_4": {"teacher_phase": 0.80, "teacher_free_phase": 0.0}, "stage_5": {"teacher_phase": 0.80, "teacher_free_phase": 0.0}},
            "periodic_evaluation_teacher_weight": 0.0,
            "evaluation_frequency": 200000,
            "evaluation_episodes": 10,
            "evaluation_objective": "teacher-free 3D velocity and yaw-rate tracking, in-place rotation, combined translation/rotation, altitude/path tracking, crash and motor-saturation rates",
            "evaluation_direction_coverage": "26 translational commands with combined yaw, four pure in-place yaw commands, and a neutral linear/angular braking tail per episode",
            "evaluation_command_hold_steps": 35,
            "evaluation_target_altitude_m": [2.0, 2.4],
            "evaluation_neutral_stop_acceptance_seconds": 3.5,
            "evaluation_mean_yaw_rate_error_acceptance_rad_s": 0.30,
            "evaluation_worst_yaw_command_error_acceptance_rad_s": 0.50,
            "evaluation_neutral_yaw_rate_acceptance_rad_s": 0.15,
            "evaluation_mean_tracking_error_acceptance_m_s": 0.50,
            "evaluation_worst_direction_error_acceptance_m_s": 0.85,
            "evaluation_neutral_speed_acceptance_m_s": 0.25,
            "evaluation_neutral_speed_sustained_seconds": 0.5,
            "checkpoint_frequency": 50000,
            "parallel_environments": 100,
            "geometry_and_rotor_positions": "Smooth2 pinned CAD-derived geometry and rotor positions only",
            "minimum_worst_case_thrust_to_weight_ratio": 1.05,
            "thrust_margin_calculation": "Smooth2 BEMT static thrust envelope with motor effectiveness and voltage-scaled rotor speed",
            "randomized_parameters": ["mass", "center_of_mass", "inertia_tensor", "motor_effectiveness", "motor_response_time", "maximum_rotor_speed", "thrust_coefficient", "torque_to_thrust_ratio", "battery_voltage_factor", "aerodynamic_drag", "wind", "sensor_noise"],
            "episode_randomization_ground_truth_hidden": true,
            "checkpoint_migration": "preserve compatible hover weights; zero-initialize four command inputs; remap legacy roll/pitch action outputs for CAD_EXPORT_Z_UP to BODY_FORWARD_LEFT_UP; initialize a fresh optimizer",
            "stage_chaining": "each stage teacher phase starts from previous stage best; its best checkpoint initializes the same-stage teacher-free phase; the teacher-free best checkpoint initializes the next stage",
            "teacher_controller": "privileged cascaded velocity/position-to-attitude controller with body-yaw-frame horizontal velocity tracking, world-up vertical velocity and independent world-vertical yaw-rate feedback; uses true randomized plant parameters and wind only inside the oracle action wrapper",
            "propeller_physics": "runtime CAD-station BEMT with axial inflow; allocator uses cached static BEMT thrust-to-RPM inverse; yaw mixer uses nominal torque-to-thrust proxy",
            "mass_properties": "Smooth2 CAD-envelope mass, CG and inertia estimates with stated uncertainty; not measured",
            "aerodynamics": "anisotropic body-axis linear/quadratic drag estimate; not CFD or wind-tunnel calibrated",
            "simulation_only": true,
            "physical_flight_eligible": false
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            find "$target" -type f -size +90M -print -quit | grep -q . && { echo "Checkpoint exceeds 90 MB."; exit 1; } || true
            git commit -m "Train universal quad PPO through five Smooth2-only velocity stages"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Print Smooth2-only training summaries
        if: always()
        run: |
          for log in universal-velocity-ppo-stage-*.log; do
            echo "===== $log ====="
            if [ -f "$log" ]; then tail -c 30000 "$log"; fi
          done
          for state in training/runs/universal-velocity-ppo-stage-*/training_state.json; do
            echo "===== $state ====="
            if [ -f "$state" ]; then cat "$state"; fi
          done

      - name: Upload Smooth2-only curriculum backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smooth2-only-five-stage-backup
          path: |
            training/runs/
            training/models/smooth2-only-five-stage/
            universal-ppo-stage-*.log
          if-no-files-found: warn
          retention-days: 90
