name: Universal PPO - Stage 2 teacher-to-teacher-free

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: universal-ppo-five-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  train-stage2-ppo:
    name: Stage 2 (700K teacher-free warm start, 1M at 0.8 teacher + 1M teacher-free)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r training/requirements.txt
          python -c "import torch; assert torch.version.cuda is None; print('CPU-only PyTorch:', torch.__version__)"

      - name: Restore the selected 700K teacher-free checkpoint from the previous run
        uses: actions/download-artifact@v4
        with:
          name: universal-ppo-stage2-teacher-to-teacher-free-backup
          run-id: 41153598860
          github-token: ${{ github.token }}
          path: bootstrap

      - name: Verify and preserve the selected 700K teacher-free checkpoint
        run: |
          set -euo pipefail
          source_dir="bootstrap/training/runs/universal-quad-v5-foundation-stage2-teacher-free"
          source_model="$source_dir/best/best_model.zip"
          source_selection="$source_dir/best/selection.json"
          test -s "$source_model" || { echo "Selected teacher-free best_model.zip is missing."; exit 1; }
          test -s "$source_selection" || { echo "Teacher-free checkpoint selection metadata is missing."; exit 1; }
          python - "$source_selection" <<'PY'
          import json, sys
          from pathlib import Path
          selection = json.loads(Path(sys.argv[1]).read_text())
          assert selection.get("timesteps") == 700000, f"Expected selected 700K checkpoint: {selection}"
          assert selection.get("report") == "profile-evaluation-700000.json", f"Unexpected selected report: {selection}"
          print("Verified selected teacher-free checkpoint:", selection)
          PY
          mkdir -p training/runs
          cp "$source_model" training/runs/stage2-initial-from-700k-teacher-free.zip
          cp "$source_selection" training/runs/stage2-initial-from-700k-teacher-free-selection.json
          sha256sum "$source_model" | tee training/runs/stage2-initial-from-700k-teacher-free.sha256

      - name: Stage 2 - train 1M steps with 80% reference teacher
        run: |
          set -euo pipefail
          python training/train_universal_ppo.py \
            --timesteps 1000000 --n-envs 20 --seed 2042 \
            --run-name universal-quad-v5-foundation-stage2-teacher \
            --output-dir training/runs --curriculum-stage 2 \
            --load-model training/runs/stage2-initial-from-700k-teacher-free.zip \
            --teacher-weight 0.8 \
            --eval-episodes 10 --eval-frequency 200000 \
            --checkpoint-frequency 20000 \
            2>&1 | tee stage2-teacher-training.log

      - name: Stage 2 - continue for 1M steps with the teacher disabled (0%)
        run: |
          set -euo pipefail
          teacher_final="training/runs/universal-quad-v5-foundation-stage2-teacher/final_model.zip"
          test -s "$teacher_final" || { echo "Stage-2 teacher-trained final checkpoint is missing."; exit 1; }
          python training/train_universal_ppo.py \
            --timesteps 1000000 --n-envs 20 --seed 2043 \
            --run-name universal-quad-v5-foundation-stage2-teacher-free \
            --output-dir training/runs --curriculum-stage 2 --no-teacher \
            --load-model "$teacher_final" \
            --eval-episodes 10 --eval-frequency 200000 \
            --checkpoint-frequency 20000 \
            2>&1 | tee stage2-teacher-free-training.log

      - name: Publish stage-2 training outputs
        if: success()
        run: |
          set -euo pipefail
          source="training/runs"
          teacher="universal-quad-v5-foundation-stage2-teacher"
          teacher_free="universal-quad-v5-foundation-stage2-teacher-free"
          test -s "$source/$teacher/final_model.zip"
          test -s "$source/$teacher/best/best_model.zip"
          test -s "$source/$teacher_free/final_model.zip"
          test -s "$source/$teacher_free/best/best_model.zip"
          target="training/models/universal-quad-v5-foundation/universal-quad-v5-foundation-stage2-teacher-to-teacher-free"
          mkdir -p "$target"
          cp -a "$source/$teacher" "$target/"
          cp -a "$source/$teacher_free" "$target/"
          cp "$source/stage2-initial-from-700k-teacher-free.zip" "$target/"
          cp "$source/stage2-initial-from-700k-teacher-free-selection.json" "$target/"
          cp "$source/stage2-initial-from-700k-teacher-free.sha256" "$target/"
          cat > "$target/training-plan.json" <<'JSON'
          {
            "active_curriculum_stage": 2,
            "stage_1_training": false,
            "initial_checkpoint_source": "best/best_model.zip from run 41153598860, stage-2 teacher-free, selected at 700000 steps",
            "stage_2_teacher_segment_timesteps": 1000000,
            "stage_2_teacher_weight": 0.8,
            "stage_2_teacher_free_segment_timesteps": 1000000,
            "stage_2_teacher_free_weight": 0.0,
            "first_segment_initial_checkpoint": "selected 700K teacher-free best_model.zip from run 41153598860",
            "second_segment_initial_checkpoint": "stage-2 teacher-trained final_model.zip",
            "parallel_environments": 20,
            "total_stage_2_timesteps": 2000000,
            "simulation_only": true,
            "physical_flight_eligible": false
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            find "$target" -type f -size +90M -print -quit | grep -q . && { echo "Checkpoint exceeds 90 MB."; exit 1; } || true
            git commit -m "Train universal PPO from 700K teacher-free checkpoint with 80% teacher then teacher-free"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Print stage-2 training summaries
        if: always()
        run: |
          for log in stage2-teacher-training.log stage2-teacher-free-training.log; do
            echo "===== $log ====="
            if [ -f "$log" ]; then tail -c 30000 "$log"; else echo "Log not produced"; fi
          done
          for state in \
            training/runs/universal-quad-v5-foundation-stage2-teacher/training_state.json \
            training/runs/universal-quad-v5-foundation-stage2-teacher-free/training_state.json; do
            echo "===== $state ====="
            if [ -f "$state" ]; then cat "$state"; else echo "State not produced"; fi
          done

      - name: Upload stage-2 training backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-ppo-stage2-teacher-to-teacher-free-backup
          path: |
            training/runs/
            training/models/universal-quad-v5-foundation/
            stage2-teacher-training.log
            stage2-teacher-free-training.log
          if-no-files-found: warn
          retention-days: 90
